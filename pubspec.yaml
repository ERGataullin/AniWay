name: app
publish_to: "none"

version: 1.1.1+7

environment:
  sdk: ^3.7.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_web_plugins:
    sdk: flutter

  animations: ^2.0.11
  cupertino_icons: ^1.0.8
  elementary: ^3.2.0
  flutter_adaptive_scaffold: ^0.3.2
  fvp: ^0.31.2
  go_router: ^15.1.1
  hive: ^2.2.3
  html: ^0.15.6
  http: ^1.3.0
  intl: ^0.19.0
  path_provider: ^2.1.5
  provider: ^6.1.5
  share_plus: ^11.0.0
  url_launcher: ^6.3.1
  video_player: ^2.9.5
  wakelock_plus: ^1.3.2
  web: ^1.1.1
  window_manager: ^0.4.3

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^5.0.0
  flutter_native_splash: ^2.4.6
  msix: ^3.16.9

flutter:
  generate: true
  uses-material-design: true
  fonts:
    - family: Alvida
      fonts:
        - asset: assets/fonts/alvida.ttf

msix_config:
  display_name: AniWay
  publisher_display_name: AniWay
  identity_name: fun.aniway.app
  output_name: AniWay
  trim_logo: false
  logo_path: web\icons\Icon-512.png
