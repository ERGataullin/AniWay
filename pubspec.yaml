name: app
publish_to: "none"

version: 1.0.3+4

environment:
  sdk: ^3.7.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_web_plugins:
    sdk: flutter

  animations: ^2.0.11
  elementary: ^3.2.0
  flutter_adaptive_scaffold: ^0.3.2
  go_router: ^14.8.1
  hive: ^2.2.3
  html: ^0.15.5+1
  http: ^1.3.0
  intl: ^0.19.0
  path_provider: ^2.1.5
  provider: ^6.1.4
  share_plus: ^10.1.4
  url_launcher: ^6.3.1
  video_player: ^2.9.5
  video_player_win: ^3.1.1
  wakelock_plus: ^1.2.11
  web: ^1.1.1
  window_manager: ^0.4.2

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^5.0.0
  flutter_native_splash: ^2.4.6
  msix: ^3.16.8

flutter:
  generate: true
  uses-material-design: true
  fonts:
    - family: Alvida
      fonts:
        - asset: assets/fonts/alvida.ttf

msix_config:
  display_name: AniWay
  publisher_display_name: AniWay
  identity_name: fun.aniway.app
  msix_version: 1.0.3.4
  output_name: AniWay
  trim_logo: false
  logo_path: web\icons\Icon-512.png
