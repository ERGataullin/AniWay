name: _
publish_to: none

environment:
  sdk: ^3.6.0

workspace:
  - app
  - core
  - features/common/auth
  - features/common/movies
  - features/common/root_menu
  - features/shared/cookie_manager
  - features/shared/l10n
  - features/shared/player
  - features/shared/theme

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_web_plugins:
    sdk: flutter

  core:
    path: core
  cookie_manager:
    path: features/shared/cookie_manager
  l10n:
    path: features/shared/l10n
  player:
    path: features/shared/player
  theme:
    path: features/shared/theme

  animations: ^2.0.11
  elementary: ^3.2.0
  go_router: ^14.6.3
  hive: ^2.2.3
  html: ^0.15.5
  http: ^1.2.2
  intl: ^0.19.0
  path_provider: ^2.1.5
  provider: ^6.1.2
  url_launcher: ^6.3.1
  video_player: ^2.9.2
  web: ^1.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
