name: app
publish_to: "none"

version: 1.1.1+7

environment:
  sdk: ^3.12.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_web_plugins:
    sdk: flutter
  intl:

  animations: ^2.2.0
  collection: ^1.19.1
  cupertino_icons: ^1.0.9
  custom_adaptive_scaffold: ^5.3.0
  device_frame_plus: ^1.5.0
  elementary: ^3.2.1
  fvp: ^0.37.3
  go_router: ^17.3.0
  hive_ce: ^2.19.3
  html: ^0.15.6
  http: ^1.6.0
  path_provider: ^2.1.6
  provider: ^6.1.5+1
  share_plus: ^13.3.0
  url_launcher: ^6.3.2
  video_player: ^2.13.0
  wakelock_plus: ^1.7.0
  web: ^1.1.1
  window_manager: ^0.5.2

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  flutter_native_splash: ^2.4.6
  msix: ^3.16.9

flutter:
  generate: true
  uses-material-design: true
  fonts:
    - family: Alvida
      fonts:
        - asset: assets/fonts/alvida.ttf

msix_config:
  identity_name: fun.aniway.app
  display_name: AniWay
  publisher_display_name: AniWay
  output_name: AniWay
  trim_logo: false
  logo_path: web\icons\Icon-512.png
